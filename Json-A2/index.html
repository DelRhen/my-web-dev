<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent Showcase · JSON-A2</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="../assets/img/favicon.png" />

  <!-- Google Font: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

  <style>
    :root {
      --bg-dark-1: #070d1e;
      --bg-dark-2: #0d1a38;
      --bg-dark-3: #12234d;
      --card-bg: #111d3b;
      --card-active-bg: #15254d;
      --card-border: #1f3363;
      --card-active-border: #3b82f6;
      --card-hover-border: #2e4a8a;
      --text-white: #ffffff;
      --text-gray: #94a3b8;
      --primary-blue: #3b82f6;
      --picker-bg: #0e1935;
      --picker-border: #1e315e;
      --picker-active: #3b82f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(135deg, var(--bg-dark-1) 0%, var(--bg-dark-2) 50%, var(--bg-dark-3) 100%);
      color: var(--text-white);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Top Navigation */
    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.2rem 2.5rem;
      background: #091329;
      border-bottom: 1px solid #1a2a50;
    }

    .brand-link {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: var(--text-white);
    }

    .brand-tag {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.25rem 0.6rem;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      color: var(--primary-blue);
      text-transform: uppercase;
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--text-gray);
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 600;
      padding: 0.5rem 1rem;
      background: #0f1b38;
      border: 1px solid #1f3363;
      border-radius: 8px;
      transition: all 0.2s ease;
    }

    .back-btn:hover {
      color: var(--text-white);
      background: #172852;
      border-color: var(--primary-blue);
    }

    /* Main Container */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
      padding: 2rem 1.5rem;
      gap: 2rem;
    }

    /* 5 CARDS CAROUSEL (Flat 2D layout matching mockup) */
    .carousel-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      margin: auto 0;
    }

    .cards-track {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      width: 100%;
    }

    /* Standard Card (Flat, rounded rectangle) */
    .card-item {
      position: relative;
      width: 200px;
      height: 420px;
      background: var(--card-bg);
      border: 1.5px solid var(--card-border);
      border-radius: 22px;
      cursor: pointer;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.3s ease, border-color 0.3s ease, opacity 0.3s ease;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.45);
      user-select: none;
    }

    /* Side Cards Scaling (Flat 2D, NO 3D / NO Rotate) */
    .card-item.side-far {
      width: 180px;
      height: 380px;
      opacity: 0.35;
      transform: scale(0.85);
    }

    .card-item.side-near {
      width: 195px;
      height: 410px;
      opacity: 0.7;
      transform: scale(0.95);
    }

    .card-item:hover:not(.center-active) {
      opacity: 0.95;
      border-color: var(--card-hover-border);
      transform: scale(0.98);
    }

    /* Center Card (Enlarged, Main Focus) */
    .card-item.center-active {
      width: 320px;
      height: 520px;
      background: var(--card-active-bg);
      border: 2px solid var(--card-active-border);
      border-radius: 26px;
      opacity: 1;
      transform: scale(1.05);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 20px rgba(59, 130, 246, 0.25);
      cursor: default;
      z-index: 5;
    }

    /* Card Top Header */
    .card-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.2rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .role-badge {
      font-size: 0.75rem;
      font-weight: 600;
      color: #60a5fa;
      background: #0f1c3a;
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      border: 1px solid #1e3568;
    }

    .agent-num {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-gray);
    }

    /* Card Visual / Placeholder Body */
    .card-visual-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      background: #0c1630;
      overflow: hidden;
      padding: 1.5rem;
      text-align: center;
    }

    .card-img-element {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .card-img-element.active {
      display: block;
    }

    .placeholder-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
      pointer-events: none;
    }

    .placeholder-initial {
      font-size: 4rem;
      font-weight: 800;
      color: rgba(255, 255, 255, 0.15);
      line-height: 1;
    }

    .placeholder-text {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-gray);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* Card Bottom Info */
    .card-footer-info {
      padding: 1.25rem;
      background: #0f1a35;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .agent-name-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text-white);
      line-height: 1.1;
    }

    .center-active .agent-name-title {
      font-size: 1.85rem;
    }

    .agent-desc-tag {
      font-size: 0.8rem;
      color: var(--text-gray);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Center Card: Quote Button */
    .quote-action-btn {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      padding: 0.6rem;
      background: #1e3a8a;
      border: 1px solid #3b82f6;
      border-radius: 8px;
      color: var(--text-white);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .center-active .quote-action-btn {
      display: flex;
    }

    .quote-action-btn:hover {
      background: #2563eb;
    }

    /* "SEARCH YOUR AGENT HERE" PILL (Exactly from wireframe) */
    .search-pill-box {
      display: none;
      position: relative;
      width: 100%;
    }

    .center-active .search-pill-box {
      display: block;
    }

    .search-pill-input {
      width: 100%;
      background: #0a1329;
      border: 1.5px solid #27417d;
      border-radius: 999px;
      padding: 0.65rem 2.2rem;
      color: var(--text-white);
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 600;
      text-align: center;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .search-pill-input::placeholder {
      color: #64748b;
      letter-spacing: 0.05em;
    }

    .search-pill-input:focus {
      border-color: var(--primary-blue);
      box-shadow: 0 0 10px rgba(59, 130, 246, 0.3);
      background: #0d1833;
    }

    .search-pill-icon {
      position: absolute;
      left: 0.85rem;
      top: 50%;
      transform: translateY(-50%);
      color: #64748b;
      font-size: 0.85rem;
      pointer-events: none;
    }

    .search-pill-clear {
      position: absolute;
      right: 0.85rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #64748b;
      font-size: 0.85rem;
      cursor: pointer;
      display: none;
    }

    .search-pill-clear:hover {
      color: var(--text-white);
    }

    /* Carousel Nav Arrows */
    .nav-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 44px;
      height: 44px;
      background: #0f1c3b;
      border: 1px solid #223766;
      border-radius: 50%;
      color: var(--text-white);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.2rem;
      transition: all 0.2s ease;
      z-index: 10;
    }

    .nav-arrow:hover {
      background: #1d3368;
      border-color: var(--primary-blue);
      transform: translateY(-50%) scale(1.08);
    }

    .nav-arrow.prev { left: 0.5rem; }
    .nav-arrow.next { right: 0.5rem; }

    /* BOTTOM AGENT PICKING SECTION */
    .picking-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.85rem;
      width: 100%;
    }

    .picking-title-pill {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #93c5fd;
      background: #0d1836;
      border: 1px solid #1d3263;
      padding: 0.4rem 1.4rem;
      border-radius: 999px;
      text-transform: uppercase;
    }

    .picking-row {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.75rem;
      max-width: 100%;
    }

    .picking-box {
      width: 58px;
      height: 58px;
      border-radius: 10px;
      background: var(--picker-bg);
      border: 1.5px solid var(--picker-border);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      transition: all 0.2s ease;
    }

    .picking-box:hover {
      background: #14244d;
      border-color: #3b82f6;
      transform: translateY(-2px);
    }

    .picking-box.selected {
      border-color: var(--primary-blue);
      background: #172a59;
      box-shadow: 0 0 12px rgba(59, 130, 246, 0.4);
      transform: translateY(-3px);
    }

    .picking-avatar {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .picking-avatar.active {
      display: block;
    }

    .picking-initial {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-white);
      line-height: 1;
    }

    .picking-box.selected .picking-initial {
      color: #60a5fa;
    }

    .picking-name {
      position: absolute;
      bottom: 2px;
      font-size: 0.6rem;
      font-weight: 600;
      color: var(--text-gray);
      text-transform: uppercase;
      max-width: 90%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .picking-box.selected .picking-name {
      color: var(--text-white);
    }

    .picking-box.search-dim {
      opacity: 0.25;
      transform: scale(0.92);
    }

    .picking-box.search-match {
      border-color: #f59e0b;
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.4);
    }

    /* POP UP MODAL THAT GIVES THE SCREEN QUOTES THEN TAP TO REMOVE */
    .quote-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(4, 9, 21, 0.85);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      cursor: pointer; /* Tap to remove */
    }

    .quote-modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .quote-modal-box {
      max-width: 580px;
      width: 100%;
      background: #0d1938;
      border: 1.5px solid #25407d;
      border-radius: 20px;
      padding: 2.5rem 2rem 2rem;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
      transform: translateY(15px);
      transition: transform 0.25s ease;
    }

    .quote-modal-overlay.active .quote-modal-box {
      transform: translateY(0);
    }

    .modal-quote-content {
      font-size: 2rem;
      font-weight: 800;
      line-height: 1.25;
      color: var(--text-white);
      margin-bottom: 1rem;
    }

    .modal-agent-label {
      font-size: 0.9rem;
      font-weight: 700;
      color: #60a5fa;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    .modal-context-desc {
      font-size: 0.8rem;
      color: var(--text-gray);
      margin-bottom: 1.75rem;
    }

    .modal-tap-hint {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      color: #94a3b8;
      background: #14244d;
      border: 1px solid #233c75;
      padding: 0.45rem 1.2rem;
      border-radius: 999px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    /* Responsive */
    @media (max-width: 992px) {
      .card-item.side-far {
        display: none;
      }
      .card-item {
        width: 175px;
        height: 380px;
      }
      .card-item.center-active {
        width: 280px;
        height: 480px;
      }
      .modal-quote-content {
        font-size: 1.6rem;
      }
    }

    @media (max-width: 640px) {
      .top-nav {
        padding: 1rem 1.25rem;
      }
      .card-item.side-near {
        display: none;
      }
      .card-item.center-active {
        width: 100%;
        max-width: 320px;
        height: 490px;
      }
      .picking-box {
        width: 48px;
        height: 48px;
      }
      .modal-quote-content {
        font-size: 1.4rem;
      }
    }
  </style>
</head>
<body>

  <!-- Top Navigation Bar -->
  <header class="top-nav">
    <a href="../index.html" class="brand-link" title="Return to Projects Hub">
      <span class="brand-tag">JSON-A2</span>
      <span class="brand-title">Agent Project</span>
    </a>
    <a href="../index.html" class="back-btn">
      <i class="bi bi-arrow-left"></i>
      <span>Projects Hub</span>
    </a>
  </header>

  <!-- Main Content Area -->
  <main class="main-content">

    <!-- 5 CARDS CAROUSEL (Flat 2D) -->
    <section class="carousel-wrapper" aria-label="Calling Cards Carousel">
      <button class="nav-arrow prev" id="prevCardBtn" aria-label="Previous Agent">
        <i class="bi bi-chevron-left"></i>
      </button>

      <div class="cards-track" id="cardsTrack">
        <!-- Rendered dynamically -->
      </div>

      <button class="nav-arrow next" id="nextCardBtn" aria-label="Next Agent">
        <i class="bi bi-chevron-right"></i>
      </button>
    </section>

    <!-- BOTTOM AGENT PICKING ROW -->
    <section class="picking-section" aria-label="Agent Picking Row">
      <div class="picking-title-pill">
        LIST OF AGENTS HERE JUST LIKE THE PICKING
      </div>

      <div class="picking-row" id="pickingRow">
        <!-- Rendered dynamically -->
      </div>
    </section>

  </main>

  <!-- POP UP MODAL THAT GIVES THE SCREEN QUOTES THEN TAP TO REMOVE -->
  <div class="quote-modal-overlay" id="quoteModalOverlay" role="dialog" aria-modal="true" aria-label="Agent Quote Modal">
    <div class="quote-modal-box">
      <div class="modal-quote-content" id="modalQuoteContent">"Watch them die."</div>
      <div class="modal-agent-label" id="modalAgentLabel">OMEN · CONTROLLER</div>
      <p class="modal-context-desc" id="modalContextDesc">Signature Voice Line</p>
      <div class="modal-tap-hint">TAP ANYWHERE TO REMOVE</div>
    </div>
  </div>

  <script>
    // Fallback data if file:// protocol blocks fetch('val.json')
    const FALLBACK_DATA = [
      {
        "id": "omen",
        "name": "OMEN",
        "role": "Controller",
        "tagline": "Shadow Walker",
        "quote": "Watch them die.",
        "quoteContext": "Ultimate Activation Voice Line",
        "cardImage": "",
        "avatarImage": ""
      },
      {
        "id": "jett",
        "name": "JETT",
        "role": "Duelist",
        "tagline": "Wind Blader",
        "quote": "Watch this!",
        "quoteContext": "Round Ace / Round Start",
        "cardImage": "",
        "avatarImage": ""
      },
      {
        "id": "reyna",
        "name": "REYNA",
        "role": "Duelist",
        "tagline": "Soul Harvester",
        "quote": "They will cower!",
        "quoteContext": "Empress Activation",
        "cardImage": "",
        "avatarImage": ""
      },
      {
        "id": "phoenix",
        "name": "PHOENIX",
        "role": "Duelist",
        "tagline": "Fire Starter",
        "quote": "Watch your eyes!",
        "quoteContext": "Curveball Flash / Match Start",
        "cardImage": "",
        "avatarImage": ""
      },
      {
        "id": "viper",
        "name": "VIPER",
        "role": "Controller",
        "tagline": "Toxic Chemist",
        "quote": "Welcome to my world.",
        "quoteContext": "Viper's Pit Activation",
        "cardImage": "",
        "avatarImage": ""
      },
      {
        "id": "sova",
        "name": "SOVA",
        "role": "Initiator",
        "tagline": "Hunter of the Tundra",
        "quote": "I am the hunter!",
        "quoteContext": "Hunter's Fury Activation",
        "cardImage": "",
        "avatarImage": ""
      },
      {
        "id": "cypher",
        "name": "CYPHER",
        "role": "Sentinel",
        "tagline": "Surveillance Network",
        "quote": "I know exactly where you are.",
        "quoteContext": "Neural Theft Activation",
        "cardImage": "",
        "avatarImage": ""
      },
      {
        "id": "killjoy",
        "name": "KILLJOY",
        "role": "Sentinel",
        "tagline": "German Inventor",
        "quote": "Don't stress, I've already thought of everything.",
        "quoteContext": "Round Preparation",
        "cardImage": "",
        "avatarImage": ""
      },
      {
        "id": "fade",
        "name": "FADE",
        "role": "Initiator",
        "tagline": "Bounty Hunter",
        "quote": "Face your fear.",
        "quoteContext": "Nightfall Activation",
        "cardImage": "",
        "avatarImage": ""
      },
      {
        "id": "chamber",
        "name": "CHAMBER",
        "role": "Sentinel",
        "tagline": "Marksman",
        "quote": "You want to play? Let's play.",
        "quoteContext": "Tour De Force Activation",
        "cardImage": "",
        "avatarImage": ""
      }
    ];

    let agents = [];
    let currentIndex = 0;
    let searchQuery = "";

    // DOM Elements
    const cardsTrack = document.getElementById('cardsTrack');
    const pickingRow = document.getElementById('pickingRow');
    const prevCardBtn = document.getElementById('prevCardBtn');
    const nextCardBtn = document.getElementById('nextCardBtn');
    const quoteModalOverlay = document.getElementById('quoteModalOverlay');
    const modalQuoteContent = document.getElementById('modalQuoteContent');
    const modalAgentLabel = document.getElementById('modalAgentLabel');
    const modalContextDesc = document.getElementById('modalContextDesc');

    // Fetch val.json locally
    async function loadData() {
      try {
        const res = await fetch('./val.json');
        if (!res.ok) throw new Error('Fetch failed');
        agents = await res.json();
      } catch (e) {
        console.warn('Using embedded dataset due to file:// CORS restriction:', e);
        agents = FALLBACK_DATA;
      }
      init();
    }

    function init() {
      if (!agents || agents.length === 0) return;
      renderPickingRow();
      renderCarousel();
      setupEvents();
    }

    function getWrappedIndex(idx) {
      const len = agents.length;
      return ((idx % len) + len) % len;
    }

    // Render 5 Flat 2D Cards: -2, -1, 0, 1, 2
    function renderCarousel() {
      cardsTrack.innerHTML = '';
      const offsets = [-2, -1, 0, 1, 2];

      offsets.forEach(offset => {
        const agentIdx = getWrappedIndex(currentIndex + offset);
        const agent = agents[agentIdx];
        const isCenter = (offset === 0);

        let cardClass = 'card-item';
        if (offset === -2 || offset === 2) cardClass += ' side-far';
        else if (offset === -1 || offset === 1) cardClass += ' side-near';
        else if (isCenter) cardClass += ' center-active';

        const card = document.createElement('div');
        card.className = cardClass;

        const hasCardImg = agent.cardImage && agent.cardImage.trim() !== "";

        card.innerHTML = `
          <div class="card-header-bar">
            <span class="role-badge">${agent.role}</span>
            <span class="agent-num">#${String(agentIdx + 1).padStart(2, '0')}</span>
          </div>

          <div class="card-visual-area">
            ${hasCardImg ? `<img src="${agent.cardImage}" alt="${agent.name}" class="card-img-element active" />` : ''}
            
            <div class="placeholder-content" style="${hasCardImg ? 'display: none;' : ''}">
              <div class="placeholder-initial">${agent.name.charAt(0)}</div>
              <div class="placeholder-text">AGENT CALLING CARD</div>
            </div>
          </div>

          <div class="card-footer-info">
            <div>
              <div class="agent-name-title">${agent.name}</div>
              <div class="agent-desc-tag">${agent.tagline || agent.role}</div>
            </div>

            ${isCenter ? `
              <button class="quote-action-btn" id="openQuoteBtn">
                <i class="bi bi-chat-quote-fill"></i>
                <span>Open Screen Quote</span>
              </button>

              <div class="search-pill-box">
                <i class="bi bi-search search-pill-icon"></i>
                <input 
                  type="text" 
                  class="search-pill-input" 
                  id="searchPillInput" 
                  placeholder="SEARCH YOUR AGENT HERE"
                  value="${searchQuery}"
                  autocomplete="off"
                  spellcheck="false"
                />
                <button class="search-pill-clear" id="searchPillClear" style="${searchQuery ? 'display:block' : 'display:none'}">
                  <i class="bi bi-x-circle-fill"></i>
                </button>
              </div>
            ` : ''}
          </div>
        `;

        if (!isCenter) {
          card.addEventListener('click', () => {
            selectAgent(agentIdx);
          });
        }

        cardsTrack.appendChild(card);
      });

      // Bind Search & Quote inside center card
      const searchInput = document.getElementById('searchPillInput');
      const searchClear = document.getElementById('searchPillClear');
      const openQuoteBtn = document.getElementById('openQuoteBtn');

      if (searchInput) {
        if (document.activeElement && document.activeElement.id === 'searchPillInput') {
          searchInput.focus();
          searchInput.setSelectionRange(searchInput.value.length, searchInput.value.length);
        }

        searchInput.addEventListener('input', (e) => {
          handleSearch(e.target.value);
        });

        searchInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            const match = findMatchingIndex(searchInput.value);
            if (match !== -1) {
              selectAgent(match);
              showQuoteModal(agents[match]);
            }
          }
        });
      }

      if (searchClear) {
        searchClear.addEventListener('click', (e) => {
          e.stopPropagation();
          searchQuery = "";
          handleSearch("");
        });
      }

      if (openQuoteBtn) {
        openQuoteBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          showQuoteModal(agents[currentIndex]);
        });
      }
    }

    // Render Bottom Picking Row
    function renderPickingRow() {
      pickingRow.innerHTML = '';
      agents.forEach((agent, idx) => {
        const box = document.createElement('div');
        box.className = `picking-box ${idx === currentIndex ? 'selected' : ''}`;
        box.id = `picker-${idx}`;
        box.title = `${agent.name} (${agent.role})`;

        const hasAvatar = agent.avatarImage && agent.avatarImage.trim() !== "";

        box.innerHTML = `
          ${hasAvatar ? `<img src="${agent.avatarImage}" class="picking-avatar active" alt="${agent.name}">` : ''}
          <div class="picking-initial" style="${hasAvatar ? 'display: none;' : ''}">
            ${agent.name.slice(0, 2)}
          </div>
          <span class="picking-name">${agent.name}</span>
        `;

        box.addEventListener('click', () => {
          const wasSelected = (idx === currentIndex);
          selectAgent(idx);
          if (wasSelected) {
            showQuoteModal(agents[idx]);
          }
        });

        pickingRow.appendChild(box);
      });
    }

    function selectAgent(idx) {
      currentIndex = getWrappedIndex(idx);
      renderCarousel();

      document.querySelectorAll('.picking-box').forEach((box, i) => {
        box.classList.toggle('selected', i === currentIndex);
      });

      const activeEl = document.getElementById(`picker-${currentIndex}`);
      if (activeEl) {
        activeEl.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
      }
    }

    function handleSearch(val) {
      searchQuery = val;
      const clean = val.trim().toLowerCase();
      const clearBtn = document.getElementById('searchPillClear');
      if (clearBtn) {
        clearBtn.style.display = clean ? 'block' : 'none';
      }

      const boxes = document.querySelectorAll('.picking-box');
      if (!clean) {
        boxes.forEach(b => b.classList.remove('search-dim', 'search-match'));
        return;
      }

      let firstMatch = -1;
      agents.forEach((ag, idx) => {
        const matches = ag.name.toLowerCase().includes(clean) || ag.role.toLowerCase().includes(clean);
        const box = document.getElementById(`picker-${idx}`);
        if (box) {
          if (matches) {
            box.classList.add('search-match');
            box.classList.remove('search-dim');
            if (firstMatch === -1) firstMatch = idx;
          } else {
            box.classList.remove('search-match');
            box.classList.add('search-dim');
          }
        }
      });

      if (firstMatch !== -1 && (clean.length >= 3 || clean === agents[firstMatch].name.toLowerCase())) {
        selectAgent(firstMatch);
      }
    }

    function findMatchingIndex(val) {
      const clean = val.trim().toLowerCase();
      if (!clean) return -1;
      return agents.findIndex(ag => ag.name.toLowerCase().includes(clean) || ag.role.toLowerCase().includes(clean));
    }

    // Modal: Tap to remove
    function showQuoteModal(agent) {
      if (!agent) return;
      modalQuoteContent.textContent = `"${agent.quote || 'Ready for action.'}"`;
      modalAgentLabel.textContent = `${agent.name} · ${agent.role}`;
      modalContextDesc.textContent = agent.quoteContext || 'Signature Voice Line';
      quoteModalOverlay.classList.add('active');
    }

    function hideQuoteModal() {
      quoteModalOverlay.classList.remove('active');
    }

    function setupEvents() {
      prevCardBtn.addEventListener('click', () => {
        selectAgent(currentIndex - 1);
      });

      nextCardBtn.addEventListener('click', () => {
        selectAgent(currentIndex + 1);
      });

      // Tap / Click anywhere on the overlay removes modal
      quoteModalOverlay.addEventListener('click', () => {
        hideQuoteModal();
      });

      // Keyboard
      window.addEventListener('keydown', (e) => {
        if (document.activeElement && document.activeElement.tagName === 'INPUT') {
          if (e.key === 'Escape') {
            hideQuoteModal();
            document.activeElement.blur();
          }
          return;
        }

        if (e.key === 'ArrowLeft') {
          selectAgent(currentIndex - 1);
        } else if (e.key === 'ArrowRight') {
          selectAgent(currentIndex + 1);
        } else if (e.key === 'Escape') {
          hideQuoteModal();
        } else if (e.key === 'Enter') {
          showQuoteModal(agents[currentIndex]);
        }
      });
    }

    window.addEventListener('DOMContentLoaded', loadData);
  </script>
</body>
</html>
