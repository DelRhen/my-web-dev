<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent Showcase · JSON-A2</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="../assets/img/favicon.png" />

  <!-- Google Font: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

  <style>
    :root {
      --bg-dark-1: #070d1e;
      --bg-dark-2: #0d1a38;
      --bg-dark-3: #12234d;
      --card-bg: #111d3b;
      --card-active-bg: #15254d;
      --card-border: #1f3363;
      --card-active-border: #3b82f6;
      --card-hover-border: #2e4a8a;
      --text-white: #ffffff;
      --text-gray: #94a3b8;
      --primary-blue: #3b82f6;
      --picker-bg: #0e1935;
      --picker-border: #1e315e;
      --picker-active: #3b82f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(135deg, var(--bg-dark-1) 0%, var(--bg-dark-2) 50%, var(--bg-dark-3) 100%);
      color: var(--text-white);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Top Navigation */
    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.1rem 2.25rem;
      background: #091329;
      border-bottom: 1px solid #1a2a50;
    }

    .brand-link {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: var(--text-white);
    }

    .brand-tag {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.25rem 0.6rem;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      color: var(--primary-blue);
      text-transform: uppercase;
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--text-gray);
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 600;
      padding: 0.5rem 1rem;
      background: #0f1b38;
      border: 1px solid #1f3363;
      border-radius: 8px;
      transition: all 0.2s ease;
    }

    .back-btn:hover {
      color: var(--text-white);
      background: #172852;
      border-color: var(--primary-blue);
    }

    /* Main Container */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
      padding: 1.5rem 1.25rem 1.25rem;
      gap: 1.5rem;
    }

    /* 5 CARDS CAROUSEL (Flat 2D layout matching mockup) */
    .carousel-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      margin: auto 0;
    }

    .cards-track {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      width: 100%;
    }

    /* Standard Card (Flat rounded rectangle) */
    .card-item {
      position: relative;
      width: 200px;
      height: 420px;
      background: var(--card-bg);
      border: 1.5px solid var(--card-border);
      border-radius: 22px;
      cursor: pointer;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.3s ease, border-color 0.3s ease, opacity 0.3s ease;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.45);
      user-select: none;
    }

    /* Side Cards Scaling (Flat 2D) */
    .card-item.side-far {
      width: 180px;
      height: 380px;
      opacity: 0.35;
      transform: scale(0.85);
    }

    .card-item.side-near {
      width: 195px;
      height: 410px;
      opacity: 0.7;
      transform: scale(0.95);
    }

    .card-item:hover:not(.center-active) {
      opacity: 0.95;
      border-color: var(--card-hover-border);
      transform: scale(0.98);
    }

    /* Center Card (Enlarged, Focus) */
    .card-item.center-active {
      width: 320px;
      height: 520px;
      background: var(--card-active-bg);
      border: 2px solid var(--card-active-border);
      border-radius: 26px;
      opacity: 1;
      transform: scale(1.05);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 20px rgba(59, 130, 246, 0.25);
      cursor: default;
      z-index: 5;
    }

    /* Card Top Header */
    .card-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.9rem 1.2rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .role-badge {
      font-size: 0.75rem;
      font-weight: 600;
      color: #60a5fa;
      background: #0f1c3a;
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      border: 1px solid #1e3568;
    }

    .agent-extra-badge {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-gray);
    }

    /* Card Visual / Placeholder Body */
    .card-visual-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      background: #0c1630;
      overflow: hidden;
      padding: 1.5rem;
      text-align: center;
    }

    .card-img-element {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .card-img-element.active {
      display: block;
    }

    .placeholder-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
      pointer-events: none;
    }

    .placeholder-initial {
      font-size: 4.2rem;
      font-weight: 800;
      color: rgba(255, 255, 255, 0.15);
      line-height: 1;
    }

    .placeholder-text {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-gray);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* Card Bottom Info */
    .card-footer-info {
      padding: 1.15rem 1.25rem;
      background: #0f1a35;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }

    .agent-name-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text-white);
      line-height: 1.1;
      text-transform: uppercase;
    }

    .center-active .agent-name-title {
      font-size: 1.85rem;
    }

    .agent-desc-tag {
      font-size: 0.8rem;
      color: var(--text-gray);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    /* Center Card: Quote Button */
    .quote-action-btn {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      padding: 0.55rem;
      background: #1e3a8a;
      border: 1px solid #3b82f6;
      border-radius: 8px;
      color: var(--text-white);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .center-active .quote-action-btn {
      display: flex;
    }

    .quote-action-btn:hover {
      background: #2563eb;
    }

    /* "SEARCH YOUR AGENT HERE" PILL (Exact wireframe element) */
    .search-pill-box {
      display: none;
      position: relative;
      width: 100%;
    }

    .center-active .search-pill-box {
      display: block;
    }

    .search-pill-input {
      width: 100%;
      background: #0a1329;
      border: 1.5px solid #27417d;
      border-radius: 999px;
      padding: 0.62rem 2.2rem;
      color: var(--text-white);
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 600;
      text-align: center;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .search-pill-input::placeholder {
      color: #64748b;
      letter-spacing: 0.05em;
    }

    .search-pill-input:focus {
      border-color: var(--primary-blue);
      box-shadow: 0 0 10px rgba(59, 130, 246, 0.3);
      background: #0d1833;
    }

    .search-pill-icon {
      position: absolute;
      left: 0.85rem;
      top: 50%;
      transform: translateY(-50%);
      color: #64748b;
      font-size: 0.85rem;
      pointer-events: none;
    }

    .search-pill-clear {
      position: absolute;
      right: 0.85rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #64748b;
      font-size: 0.85rem;
      cursor: pointer;
      display: none;
    }

    .search-pill-clear:hover {
      color: var(--text-white);
    }

    /* Carousel Nav Arrows */
    .nav-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 44px;
      height: 44px;
      background: #0f1c3b;
      border: 1px solid #223766;
      border-radius: 50%;
      color: var(--text-white);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.2rem;
      transition: all 0.2s ease;
      z-index: 10;
    }

    .nav-arrow:hover {
      background: #1d3368;
      border-color: var(--primary-blue);
      transform: translateY(-50%) scale(1.08);
    }

    .nav-arrow.prev { left: 0.25rem; }
    .nav-arrow.next { right: 0.25rem; }

    /* BOTTOM AGENT PICKING SECTION */
    .picking-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      width: 100%;
    }

    .picking-title-pill {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #93c5fd;
      background: #0d1836;
      border: 1px solid #1d3263;
      padding: 0.35rem 1.35rem;
      border-radius: 999px;
      text-transform: uppercase;
    }

    /* Scrollable Container for 29 Agents */
    .picking-tray-scroll {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      gap: 0.6rem;
      max-width: 100%;
      overflow-x: auto;
      padding: 0.5rem 0.5rem 0.75rem;
      scrollbar-width: thin;
      scrollbar-color: #27417d #0a1329;
    }

    .picking-tray-scroll::-webkit-scrollbar {
      height: 6px;
    }

    .picking-tray-scroll::-webkit-scrollbar-track {
      background: #0a1329;
      border-radius: 3px;
    }

    .picking-tray-scroll::-webkit-scrollbar-thumb {
      background: #27417d;
      border-radius: 3px;
    }

    .picking-box {
      flex: 0 0 54px;
      width: 54px;
      height: 54px;
      border-radius: 10px;
      background: var(--picker-bg);
      border: 1.5px solid var(--picker-border);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      transition: all 0.2s ease;
    }

    .picking-box:hover {
      background: #14244d;
      border-color: #3b82f6;
      transform: translateY(-2px);
    }

    .picking-box.selected {
      border-color: var(--primary-blue);
      background: #172a59;
      box-shadow: 0 0 10px rgba(59, 130, 246, 0.4);
      transform: translateY(-2px);
    }

    .picking-avatar {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .picking-avatar.active {
      display: block;
    }

    .picking-initial {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text-white);
      line-height: 1;
    }

    .picking-box.selected .picking-initial {
      color: #60a5fa;
    }

    .picking-name {
      position: absolute;
      bottom: 2px;
      font-size: 0.55rem;
      font-weight: 600;
      color: var(--text-gray);
      text-transform: uppercase;
      max-width: 90%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .picking-box.selected .picking-name {
      color: var(--text-white);
    }

    .picking-box.search-dim {
      opacity: 0.25;
      transform: scale(0.92);
    }

    .picking-box.search-match {
      border-color: #f59e0b;
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.4);
    }

    /* POP UP MODAL THAT GIVES THE SCREEN QUOTES THEN TAP TO REMOVE */
    .quote-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(4, 9, 21, 0.85);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      cursor: pointer; /* Tap to remove */
    }

    .quote-modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .quote-modal-box {
      max-width: 580px;
      width: 100%;
      background: #0d1938;
      border: 1.5px solid #25407d;
      border-radius: 20px;
      padding: 2.5rem 2rem 2rem;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
      transform: translateY(15px);
      transition: transform 0.25s ease;
    }

    .quote-modal-overlay.active .quote-modal-box {
      transform: translateY(0);
    }

    .modal-quote-content {
      font-size: 2rem;
      font-weight: 800;
      line-height: 1.25;
      color: var(--text-white);
      margin-bottom: 1rem;
    }

    .modal-agent-label {
      font-size: 0.9rem;
      font-weight: 700;
      color: #60a5fa;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    .modal-context-desc {
      font-size: 0.8rem;
      color: var(--text-gray);
      margin-bottom: 1.75rem;
    }

    .modal-tap-hint {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      color: #94a3b8;
      background: #14244d;
      border: 1px solid #233c75;
      padding: 0.45rem 1.2rem;
      border-radius: 999px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    /* Responsive */
    @media (max-width: 992px) {
      .card-item.side-far {
        display: none;
      }
      .card-item {
        width: 175px;
        height: 380px;
      }
      .card-item.center-active {
        width: 280px;
        height: 480px;
      }
      .modal-quote-content {
        font-size: 1.6rem;
      }
    }

    @media (max-width: 640px) {
      .top-nav {
        padding: 1rem 1.25rem;
      }
      .card-item.side-near {
        display: none;
      }
      .card-item.center-active {
        width: 100%;
        max-width: 320px;
        height: 490px;
      }
      .picking-box {
        flex: 0 0 46px;
        width: 46px;
        height: 46px;
      }
      .modal-quote-content {
        font-size: 1.4rem;
      }
    }
  </style>
</head>
<body>

  <!-- Top Navigation Bar -->
  <header class="top-nav">
    <a href="../index.html" class="brand-link" title="Return to Projects Hub">
      <span class="brand-tag">JSON-A2</span>
      <span class="brand-title">Agent Project</span>
    </a>
    <a href="../index.html" class="back-btn">
      <i class="bi bi-arrow-left"></i>
      <span>Projects Hub</span>
    </a>
  </header>

  <!-- Main Content Area -->
  <main class="main-content">

    <!-- 5 CARDS CAROUSEL (Flat 2D) -->
    <section class="carousel-wrapper" aria-label="Calling Cards Carousel">
      <button class="nav-arrow prev" id="prevCardBtn" aria-label="Previous Agent">
        <i class="bi bi-chevron-left"></i>
      </button>

      <div class="cards-track" id="cardsTrack">
        <!-- Rendered dynamically -->
      </div>

      <button class="nav-arrow next" id="nextCardBtn" aria-label="Next Agent">
        <i class="bi bi-chevron-right"></i>
      </button>
    </section>



      <div class="picking-tray-scroll" id="pickingTrayScroll">
        <!-- 29 Agents rendered dynamically -->
      </div>
    </section>

  </main>

  <!-- POP UP MODAL THAT GIVES THE SCREEN QUOTES THEN TAP TO REMOVE -->
  <div class="quote-modal-overlay" id="quoteModalOverlay" role="dialog" aria-modal="true" aria-label="Agent Quote Modal">
    <div class="quote-modal-box">
      <div class="modal-quote-content" id="modalQuoteContent">"Scatter!"</div>
      <div class="modal-agent-label" id="modalAgentLabel">OMEN · CONTROLLER</div>
      <p class="modal-context-desc" id="modalContextDesc">Pick Rate: 7.0%</p>
      <div class="modal-tap-hint">TAP ANYWHERE TO REMOVE</div>
    </div>
  </div>

  <script>
    // Embedded copy of the exact user val.json in case file:// protocol blocks local fetch()
    const EXACT_VAL_JSON = {
      "agents": [
        { "name": "Astra", "role": "Controller", "nationality": "Ghana", "quote": "You divide, they fall.", "pick_percentage": "1.2%" },
        { "name": "Breach", "role": "Initiator", "nationality": "Sweden", "quote": "Off your feet!", "pick_percentage": "2.0%" },
        { "name": "Brimstone", "role": "Controller", "nationality": "United States", "quote": "Open up the sky!", "pick_percentage": "1.7%" },
        { "name": "Chamber", "role": "Sentinel", "nationality": "France", "quote": "You have good taste, my friend.", "pick_percentage": "2.7%" },
        { "name": "Clove", "role": "Controller", "nationality": "Scotland (United Kingdom)", "quote": "Not dead yet!", "pick_percentage": "8.1%" },
        { "name": "Cypher", "role": "Sentinel", "nationality": "Morocco", "quote": "I know exactly where you are.", "pick_percentage": "4.7%" },
        { "name": "Deadlock", "role": "Sentinel", "nationality": "Norway", "quote": "My territory, my rules.", "pick_percentage": "2.4%" },
        { "name": "Fade", "role": "Initiator", "nationality": "Turkey", "quote": "Face your fear.", "pick_percentage": "3.0%" },

        { "name": "Harbor", "role": "Controller", "nationality": "India", "quote": "Let the tides turn.", "pick_percentage": "1.1%" },
        { "name": "Iso", "role": "Duelist", "nationality": "China", "quote": "It's just you and me.", "pick_percentage": "4.9%" },
        { "name": "Jett", "role": "Duelist", "nationality": "South Korea", "quote": "Watch this!", "pick_percentage": "9.4%" },
        { "name": "KAY/O", "role": "Initiator", "nationality": "Alternate Earth (Robot)", "quote": "No one walks away.", "pick_percentage": "1.8%" },
        { "name": "Killjoy", "role": "Sentinel", "nationality": "Germany", "quote": "Don't stress, I've already thought of everything.", "pick_percentage": "4.2%" },
        { "name": "Miks", "role": "Controller", "nationality": "Croatia", "quote": "Breathe in, let's reset.", "pick_percentage": "1.3%" },
        { "name": "Neon", "role": "Duelist", "nationality": "Philippines", "quote": "Here we go!", "pick_percentage": "2.3%" },
        { "name": "Omen", "role": "Controller", "nationality": "Unknown", "quote": "Scatter!", "pick_percentage": "7.0%" },
        { "name": "Phoenix", "role": "Duelist", "nationality": "United Kingdom", "quote": "Joke's over, you're dead!", "pick_percentage": "3.5%" },
        { "name": "Raze", "role": "Duelist", "nationality": "Brazil", "quote": "Here comes the party!", "pick_percentage": "4.1%" },
        { "name": "Reyna", "role": "Duelist", "nationality": "Mexico", "quote": "They will cower!", "pick_percentage": "10.2%" },
        { "name": "Sage", "role": "Sentinel", "nationality": "China", "quote": "Your duty is not over!", "pick_percentage": "4.0%" },
        { "name": "Skye", "role": "Initiator", "nationality": "Australia", "quote": "Seek them out!", "pick_percentage": "2.8%" },
        { "name": "Sova", "role": "Initiator", "nationality": "Russia", "quote": "I am the hunter!", "pick_percentage": "4.5%" },
        { "name": "Tejo", "role": "Initiator", "nationality": "Colombia", "quote": "Armageddon incoming.", "pick_percentage": "1.5%" },
        { "name": "Veto", "role": "Sentinel", "nationality": "Senegal", "quote": "Clear the path.", "pick_percentage": "1.0%" },
        { "name": "Viper", "role": "Controller", "nationality": "United States", "quote": "Welcome to my world!", "pick_percentage": "3.2%" },
        { "name": "Vyse", "role": "Sentinel", "nationality": "Unknown", "quote": "Steel your resolve.", "pick_percentage": "2.2%" },
        { "name": "Waylay", "role": "Duelist", "nationality": "Thailand", "quote": "Catch me if you can.", "pick_percentage": "2.6%" },
        { "name": "Yoru", "role": "Duelist", "nationality": "Japan", "quote": "I'll handle this.", "pick_percentage": "1.9%" }
      ]
    };

    let agents = [];
    let currentIndex = 0;
    let searchQuery = "";

    // DOM Elements
    const cardsTrack = document.getElementById('cardsTrack');
    const pickingTrayScroll = document.getElementById('pickingTrayScroll');
    const prevCardBtn = document.getElementById('prevCardBtn');
    const nextCardBtn = document.getElementById('nextCardBtn');
    const quoteModalOverlay = document.getElementById('quoteModalOverlay');
    const modalQuoteContent = document.getElementById('modalQuoteContent');
    const modalAgentLabel = document.getElementById('modalAgentLabel');
    const modalContextDesc = document.getElementById('modalContextDesc');

    // Load val.json
    async function loadData() {
      try {
        const res = await fetch('./val.json');
        if (!res.ok) throw new Error('Fetch failed');
        const data = await res.json();
        agents = data.agents || (Array.isArray(data) ? data : []);
      } catch (e) {
        console.warn('Loading fallback embedded val.json data:', e);
        agents = EXACT_VAL_JSON.agents;
      }
      init();
    }

    function init() {
      if (!agents || agents.length === 0) return;
      renderPickingRow();
      renderCarousel();
      setupEvents();
    }

    function getWrappedIndex(idx) {
      const len = agents.length;
      return ((idx % len) + len) % len;
    }

    // Render 5 Flat 2D Cards: -2, -1, 0, 1, 2
    function renderCarousel() {
      cardsTrack.innerHTML = '';
      const offsets = [-2, -1, 0, 1, 2];

      offsets.forEach(offset => {
        const agentIdx = getWrappedIndex(currentIndex + offset);
        const agent = agents[agentIdx];
        const isCenter = (offset === 0);

        let cardClass = 'card-item';
        if (offset === -2 || offset === 2) cardClass += ' side-far';
        else if (offset === -1 || offset === 1) cardClass += ' side-near';
        else if (isCenter) cardClass += ' center-active';

        const card = document.createElement('div');
        card.className = cardClass;

        const hasCardImg = agent.cardImage && agent.cardImage.trim() !== "";
        const agentName = agent.name || "Agent";
        const agentRole = agent.role || "Specialist";
        const extraInfo = agent.pick_percentage ? `Pick: ${agent.pick_percentage}` : (agent.nationality || "");

        card.innerHTML = `
          <div class="card-header-bar">
            <span class="role-badge">${agentRole}</span>
            <span class="agent-extra-badge">${extraInfo}</span>
          </div>

          <div class="card-visual-area">
            ${hasCardImg ? `<img src="${agent.cardImage}" alt="${agentName}" class="card-img-element active" />` : ''}
            
            <div class="placeholder-content" style="${hasCardImg ? 'display: none;' : ''}">
              <div class="placeholder-initial">${agentName.charAt(0)}</div>
              <div class="placeholder-text">AGENT CALLING CARD</div>
            </div>
          </div>

          <div class="card-footer-info">
            <div>
              <div class="agent-name-title">${agentName}</div>
              <div class="agent-desc-tag">${agent.nationality ? `${agent.nationality} · ` : ''}"${agent.quote || ''}"</div>
            </div>

            ${isCenter ? `
              <button class="quote-action-btn" id="openQuoteBtn">
                <i class="bi bi-chat-quote-fill"></i>
                <span>Agent Quote</span>
              </button>

              <div class="search-pill-box">
                <i class="bi bi-search search-pill-icon"></i>
                <input 
                  type="text" 
                  class="search-pill-input" 
                  id="searchPillInput" 
                  placeholder="SEARCH YOUR AGENT HERE"
                  value="${searchQuery}"
                  autocomplete="off"
                  spellcheck="false"
                />
                <button class="search-pill-clear" id="searchPillClear" style="${searchQuery ? 'display:block' : 'display:none'}">
                  <i class="bi bi-x-circle-fill"></i>
                </button>
              </div>
            ` : ''}
          </div>
        `;

        if (!isCenter) {
          card.addEventListener('click', () => {
            selectAgent(agentIdx);
          });
        }

        cardsTrack.appendChild(card);
      });

      // Bind Search & Quote inside center card
      const searchInput = document.getElementById('searchPillInput');
      const searchClear = document.getElementById('searchPillClear');
      const openQuoteBtn = document.getElementById('openQuoteBtn');

      if (searchInput) {
        if (document.activeElement && document.activeElement.id === 'searchPillInput') {
          searchInput.focus();
          searchInput.setSelectionRange(searchInput.value.length, searchInput.value.length);
        }

        searchInput.addEventListener('input', (e) => {
          handleSearch(e.target.value);
        });

        searchInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            const match = findMatchingIndex(searchInput.value);
            if (match !== -1) {
              selectAgent(match);
              showQuoteModal(agents[match]);
            }
          }
        });
      }

      if (searchClear) {
        searchClear.addEventListener('click', (e) => {
          e.stopPropagation();
          searchQuery = "";
          handleSearch("");
        });
      }

      if (openQuoteBtn) {
        openQuoteBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          showQuoteModal(agents[currentIndex]);
        });
      }
    }

    // Render Bottom Picking Row (All 29 agents)
    function renderPickingRow() {
      pickingTrayScroll.innerHTML = '';
      agents.forEach((agent, idx) => {
        const box = document.createElement('div');
        box.className = `picking-box ${idx === currentIndex ? 'selected' : ''}`;
        box.id = `picker-${idx}`;
        const agentName = agent.name || "Agent";
        box.title = `${agentName} (${agent.role || ''} · ${agent.nationality || ''})`;

        const hasAvatar = agent.avatarImage && agent.avatarImage.trim() !== "";

        box.innerHTML = `
          ${hasAvatar ? `<img src="${agent.avatarImage}" class="picking-avatar active" alt="${agentName}">` : ''}
          <div class="picking-initial" style="${hasAvatar ? 'display: none;' : ''}">
            ${agentName.slice(0, 2)}
          </div>
          <span class="picking-name">${agentName}</span>
        `;

        box.addEventListener('click', () => {
          const wasSelected = (idx === currentIndex);
          selectAgent(idx);
          if (wasSelected) {
            showQuoteModal(agents[idx]);
          }
        });

        pickingTrayScroll.appendChild(box);
      });
    }

    function selectAgent(idx) {
      currentIndex = getWrappedIndex(idx);
      renderCarousel();

      document.querySelectorAll('.picking-box').forEach((box, i) => {
        box.classList.toggle('selected', i === currentIndex);
      });

      const activeEl = document.getElementById(`picker-${currentIndex}`);
      if (activeEl) {
        activeEl.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
      }
    }

    function handleSearch(val) {
      searchQuery = val;
      const clean = val.trim().toLowerCase();
      const clearBtn = document.getElementById('searchPillClear');
      if (clearBtn) {
        clearBtn.style.display = clean ? 'block' : 'none';
      }

      const boxes = document.querySelectorAll('.picking-box');
      if (!clean) {
        boxes.forEach(b => b.classList.remove('search-dim', 'search-match'));
        return;
      }

      let firstMatch = -1;
      agents.forEach((ag, idx) => {
        const nameMatch = (ag.name || "").toLowerCase().includes(clean);
        const roleMatch = (ag.role || "").toLowerCase().includes(clean);
        const natMatch = (ag.nationality || "").toLowerCase().includes(clean);
        const matches = nameMatch || roleMatch || natMatch;

        const box = document.getElementById(`picker-${idx}`);
        if (box) {
          if (matches) {
            box.classList.add('search-match');
            box.classList.remove('search-dim');
            if (firstMatch === -1) firstMatch = idx;
          } else {
            box.classList.remove('search-match');
            box.classList.add('search-dim');
          }
        }
      });

      if (firstMatch !== -1 && (clean.length >= 3 || clean === (agents[firstMatch].name || "").toLowerCase())) {
        selectAgent(firstMatch);
      }
    }

    function findMatchingIndex(val) {
      const clean = val.trim().toLowerCase();
      if (!clean) return -1;
      return agents.findIndex(ag => 
        (ag.name || "").toLowerCase().includes(clean) || 
        (ag.role || "").toLowerCase().includes(clean) ||
        (ag.nationality || "").toLowerCase().includes(clean)
      );
    }

    // Modal: Tap to remove
    function showQuoteModal(agent) {
      if (!agent) return;
      modalQuoteContent.textContent = `"${agent.quote || 'Ready for action.'}"`;
      modalAgentLabel.textContent = `${agent.name || 'Agent'} · ${agent.role || 'Specialist'}${agent.nationality ? ` (${agent.nationality})` : ''}`;
      modalContextDesc.textContent = agent.pick_percentage ? `Pick Rate: ${agent.pick_percentage}` : 'Signature Voice Line';
      quoteModalOverlay.classList.add('active');
    }

    function hideQuoteModal() {
      quoteModalOverlay.classList.remove('active');
    }

    function setupEvents() {
      prevCardBtn.addEventListener('click', () => {
        selectAgent(currentIndex - 1);
      });

      nextCardBtn.addEventListener('click', () => {
        selectAgent(currentIndex + 1);
      });

      // Tap / Click anywhere on the overlay removes modal
      quoteModalOverlay.addEventListener('click', () => {
        hideQuoteModal();
      });

      // Keyboard
      window.addEventListener('keydown', (e) => {
        if (document.activeElement && document.activeElement.tagName === 'INPUT') {
          if (e.key === 'Escape') {
            hideQuoteModal();
            document.activeElement.blur();
          }
          return;
        }

        if (e.key === 'ArrowLeft') {
          selectAgent(currentIndex - 1);
        } else if (e.key === 'ArrowRight') {
          selectAgent(currentIndex + 1);
        } else if (e.key === 'Escape') {
          hideQuoteModal();
        } else if (e.key === 'Enter') {
          showQuoteModal(agents[currentIndex]);
        }
      });
    }

    window.addEventListener('DOMContentLoaded', loadData);
  </script>
</body>
</html>
