<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bento-A1 Layout</title>
  <link rel="icon" type="image/png" href="../assets/img/favicon.png"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>

  <style>
    body {
      background-color: #111111;
      color: #f0f0f0;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 2rem 0;
    }

    .bento-card {
      background-color: #1e1e1e;
      border: 1px solid #2e2e2e;
      border-radius: 1rem;
      font-weight: 600;
      color: #f0f0f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    .bento-card:hover {
      transform: translateY(-3px);
      border-color: #444;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    .bento-card .bento-label {
      font-size: 0.95rem;
      letter-spacing: 1px;
    }

    .bento-card .bento-sub {
      font-size: 0.75rem;
      color: #aaaaaa;
      font-weight: 400;
      margin-top: 4px;
    }
  </style>
</head>

<body>
  
  <div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <a href="../index.html" class="btn btn-outline-light btn-sm mb-2"><i class="bi bi-arrow-left me-1"></i> Back to Hub</a>
        <h3 class="fw-bold m-0">Bento-A1 Grid</h3>
      </div>
      <span class="badge bg-dark border border-secondary text-secondary-emphasis px-3 py-2">Module A1</span>
    </div>

    <!-- Bento-A1 Grid -->
    <div class="row g-3">
      <!-- LEFT COLUMN: col-3 -->
      <div class="col-12 col-md-3 d-flex flex-column gap-3">
        <div class="bento-card" style="height: 150px;">
          <div class="bento-label">CARD 1</div>
          <div class="bento-sub">Analytics & Stats</div>
        </div>
        <div class="bento-card" style="height: 150px;">
          <div class="bento-label">CARD 2</div>
          <div class="bento-sub">Server Health</div>
        </div>
        <div class="row g-3">
          <div class="col-6">
            <div class="bento-card" style="height: 150px;">
              <div class="bento-label">CARD 3A</div>
              <div class="bento-sub">Logs</div>
            </div>
          </div>
          <div class="col-6">
            <div class="bento-card" style="height: 150px;">
              <div class="bento-label">CARD 3B</div>
              <div class="bento-sub">Speed</div>
            </div>
          </div>
        </div>
      </div>

      <!-- RIGHT COLUMN: col-9 -->
      <div class="col-12 col-md-9">
        <div class="row g-3">
          <div class="col-12 col-md-9">
            <div class="row g-3 mb-3">
              <div class="col-6">
                <div class="bento-card" style="height: 150px;">
                  <div class="bento-label">CARD 4</div>
                  <div class="bento-sub">User Activity</div>
                </div>
              </div>
              <div class="col-6">
                <div class="bento-card" style="height: 150px;">
                  <div class="bento-label">CARD 5</div>
                  <div class="bento-sub">Cloud Storage</div>
                </div>
              </div>
            </div>
            <div class="row g-3">
              <div class="col-12">
                <div class="bento-card" style="height: 316px;">
                  <div class="bento-label fs-5">CARD 6</div>
                  <div class="bento-sub">Core Visualization & Interactive Dashboard</div>
                </div>
              </div>
            </div>
          </div>

          <div class="col-12 col-md-3">
            <div class="bento-card h-100" style="min-height: 180px;">
              <div class="bento-label">CARD 7</div>
              <div class="bento-sub">Live Feed Stream</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
