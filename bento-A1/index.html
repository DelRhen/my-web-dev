<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bento-A1 Layout</title>
  <link rel="icon" type="image/png" href="../assets/img/favicon.png"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>

  <style>
    body {
      background: linear-gradient(135deg, #0a0a1a 0%, #0d0b1e 25%, #111128 50%, #0e0a1f 75%, #080818 100%);
      color: #f0f0f0;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 2.5rem 0;
      position: relative;
    }

    /* Subtle glow effects */
    body::before {
      content: "";
      position: fixed;
      top: -30%;
      left: -20%;
      width: 60%;
      height: 60%;
      background: radial-gradient(circle, rgba(60, 30, 120, 0.15) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: "";
      position: fixed;
      bottom: -30%;
      right: -20%;
      width: 60%;
      height: 60%;
      background: radial-gradient(circle, rgba(20, 40, 100, 0.12) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .container-fluid {
      position: relative;
      z-index: 1;
    }

    .bento-card {
      background-color: rgba(15, 13, 30, 0.6);
      border: 1px solid rgba(80, 60, 140, 0.2);
      border-radius: 1.25rem;
      font-weight: 600;
      color: #f0f0f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(10, 5, 30, 0.5);
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      position: relative;
      overflow: hidden;
      padding: 1.5rem;
      text-align: center;
    }

    .bento-card:hover {
      transform: translateY(-4px);
      border-color: rgba(100, 80, 180, 0.35);
      box-shadow: 0 10px 35px rgba(20, 10, 60, 0.6);
    }

    /* Bento Background Image — natural brightness */
    .bento-card .bento-bg-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      transition: transform 0.4s ease, opacity 0.3s ease;
      z-index: 1;
      opacity: 0.88;
    }

    .bento-card:hover .bento-bg-img {
      transform: scale(1.06);
      opacity: 1;
    }

    /* Very subtle tinted overlay — keeps images looking natural */
    .bento-card .bento-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, rgba(10, 8, 25, 0.08) 0%, rgba(10, 8, 25, 0.35) 100%);
      z-index: 2;
      pointer-events: none;
    }

    /* Text content container floating above image */
    .bento-card .bento-content {
      position: relative;
      z-index: 3;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .bento-card .bento-label {
      font-size: 1.2rem;
      letter-spacing: 1.5px;
      font-weight: 700;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
    }

    .bento-card .bento-sub {
      font-size: 0.88rem;
      color: #dddddd;
      font-weight: 400;
      margin-top: 6px;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
    }

    @media (max-width: 768px) {
      body {
        padding: 1rem 0;
      }
      .bento-card {
        min-height: 150px !important;
        height: auto !important;
        padding: 1.5rem 1rem;
      }
    }
  </style>
</head>

<body>
  
  <div class="container-fluid px-3 px-lg-5" style="max-width: 1720px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <a href="../index.html" class="btn btn-outline-light btn-sm mb-2"><i class="bi bi-arrow-left me-1"></i> Back to Hub</a>
        <h3 class="fw-bold m-0">Bento-A1 Grid</h3>
      </div>
      <div class="d-flex align-items-center gap-2">
        <button id="fsToggleBtn" class="btn btn-outline-light btn-sm" title="Toggle browser fullscreen">
          <i class="bi bi-arrows-fullscreen me-1"></i> Fullscreen Mode
        </button>
      </div>
    </div>

    <!-- Bento-A1 Grid -->
    <div class="row g-3 mb-3">
      <!-- LEFT COLUMN: col-3 -->
      <div class="col-12 col-md-3 d-flex flex-column gap-3">
        <!-- CARD 1 -->
        <div class="bento-card" style="height: 220px;">
          <img src="../assets/img/card1.jpg" alt="card 1" class="bento-bg-img" loading="lazy" />
          <div class="bento-overlay"></div>
          <div class="bento-content">
          </div>
        </div>

        <!-- CARD 2 -->
        <div class="bento-card" style="height: 220px;">
          <img src="../assets/img/omen2.jfif" alt="Omen2" class="bento-bg-img" loading="lazy" />
          <div class="bento-overlay"></div>
          <div class="bento-content">
          </div>
        </div>

        <!-- CARD 3A & 3B -->
        <div class="row g-3">
          <div class="col-6">
            <div class="bento-card" style="height: 220px;">
              <img src="../assets/img/immortal.jfif" alt="Immo" class="bento-bg-img" loading="lazy" />
              <div class="bento-overlay"></div>
              <div class="bento-content">
              </div>
            </div>
          </div>
          <div class="col-6">
            <div class="bento-card" style="height: 220px;">
              <img src="../assets/img/omen.gif" alt="Live Feed" class="bento-bg-img" loading="lazy" />
              <div class="bento-overlay"></div>
              <div class="bento-content">
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- RIGHT COLUMN: col-9 -->
      <div class="col-12 col-md-9">
        <div class="row g-3">
          <div class="col-12 col-md-9">
            <!-- TOP SUB-ROW: CARD 4 & 5 -->
            <div class="row g-3 mb-3">
              <div class="col-6">
                <div class="bento-card" style="height: 220px;">
                  <img src="../assets/img/bloodstrike.gif" alt="Bloodstrike" class="bento-bg-img" loading="lazy" />
                  <div class="bento-overlay"></div>
                  <div class="bento-content">
                  </div>
                </div>
              </div>
              <div class="col-6">
                <div class="bento-card" style="height: 220px;">
                  <img src="../assets/img/card3.jpg" alt="card 5" class="bento-bg-img" loading="lazy" />
                  <div class="bento-overlay"></div>
                  <div class="bento-content">
                  </div>
                </div>
              </div>
            </div>

            <!-- BOTTOM SUB-ROW: CARD 6 -->
            <div class="row g-3">
              <div class="col-12">
                <div class="bento-card" style="height: 456px;">
                  <img src="../assets/img/rhendel.jfif" alt="Rhendel" class="bento-bg-img" loading="lazy" />
                  <div class="bento-overlay"></div>
                  <div class="bento-content">
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- INNER RIGHT: CARD 7 -->
          <div class="col-12 col-md-3">
            <div class="bento-card h-100" style="min-height: 300px;">
              <img src="../assets/img/neon.gif" alt="Card 7" class="bento-bg-img" loading="lazy" />
              <div class="bento-overlay"></div>
              <div class="bento-content">
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ROW 2: 3 COLUMNS (CARDS 8, 9, 10) -->
    <div class="row g-3">
      <div class="col-12 col-md-4">
        <div class="bento-card" style="height: 220px;">
          <img src="../assets/img/card2.jfif" alt="Card 2" class="bento-bg-img" loading="lazy" />
          <div class="bento-overlay"></div>
          <div class="bento-content">
          </div>
        </div>
      </div>
      <div class="col-12 col-md-4">
        <div class="bento-card" style="height: 220px;">
          <img src="../assets/img/omen3.jfif" alt="Omen" class="bento-bg-img" loading="lazy" />
          <div class="bento-overlay"></div>
          <div class="bento-content">
          </div>
        </div>
      </div>
      <div class="col-12 col-md-4">
        <div class="bento-card" style="height: 220px;">
          <img src="../assets/img/card11.jfif" alt="Card 11" class="bento-bg-img" loading="lazy" />
          <div class="bento-overlay"></div>
          <div class="bento-content">
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const fsToggleBtn = document.getElementById('fsToggleBtn');
    if (fsToggleBtn) {
      fsToggleBtn.addEventListener('click', () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(err => {
            console.error(`Error attempting fullscreen: ${err.message}`);
          });
        } else {
          document.exitFullscreen().catch(err => {
            console.error(`Error exiting fullscreen: ${err.message}`);
          });
        }
      });

      document.addEventListener('fullscreenchange', () => {
        if (document.fullscreenElement) {
          fsToggleBtn.innerHTML = '<i class="bi bi-fullscreen-exit me-1"></i> Exit Fullscreen';
        } else {
          fsToggleBtn.innerHTML = '<i class="bi bi-arrows-fullscreen me-1"></i> Fullscreen Mode';
        }
      });
    }
  </script>
</body>

</html>
